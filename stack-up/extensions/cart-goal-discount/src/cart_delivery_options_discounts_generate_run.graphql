query DeliveryInput {
  presentmentCurrencyRate
  shop {
    appStatus: metafield(namespace: "stack_up", key: "stack_up_app_enabled") {
      value
    }
    cartGoalOffers: metafield(namespace: "stack_up", key: "cart_goal_offers") {
      value
    }
  }
  cart {
    lines {
      id
      quantity
      cost {
        subtotalAmount {
          amount
        }
      }
      merchandise {
        __typename
        ... on ProductVariant {
          id
          product {
            id
          }
        }
      }
      attribute(key: "_stackup_free_gift") {
        value
      }
    }
    deliveryGroups {
      id
      deliveryOptions {
        deliveryMethodType
      }
    }
  }
  discount {
    discountClasses
  }
}
